name: Validate reproducibility artifact

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python sources
        run: python -m compileall -q scripts src tests
      - name: Reproduce reference analyses
        run: |
          python scripts/reproduce_analysis.py \
            --reference-root results/reference \
            --output-dir reproduced/analysis \
            --strict
      - name: Validate release integrity
        run: |
          python scripts/validate_release.py \
            --repository-root . \
            --manifest audit/release_manifest.csv \
            --checksums audit/source_checksums.sha256 \
            --expected audit/expected_coverage.json \
            --strict
